<!doctype html>
<html lang="en">

    <meta charset="utf-8" />
    <title>Banner</title>
  </head>
  <body>
    <!--
      A tool that percent-encodes every character it does not trust wrote the separator
      as %5C. A browser keeps it as written, and only a Windows server decodes it to a folder.
    -->
    <img src="/img%5Cbanner.png" alt="The banner" />
  </body>
