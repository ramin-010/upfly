<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Team</title>
  </head>
  <body>
    <!--
      Written on Windows, with the folder separator the file manager shows. The URL parser
      reads a backslash as a slash, so every browser loads the picture from /img/.
    -->
    <img src="\img\team.jpg" alt="The team" />
  </body>
</html>
