<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The quote on the next line</title>
  </head>
  <body>
    <h1>Our banner</h1>

    <!--
      The closing quote sits on the line below the address, so the value ends with a
      line break. A browser strips the whitespace around an address before loading it.
    -->
    <img alt="" src="/img/banner.png
">
  </body>
</html>
