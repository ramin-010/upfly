<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Saved on Windows</title>
  </head>
  <body>
    <h1>Saved on Windows</h1>

    <!--
      Every line of this page ends with CR LF. The HTML parser reads each CR LF as one LF
      before it reads any markup, so a value that spans lines is not its source text.
    -->
    <img alt="" srcset="/srcset/tile.png 1x,
         /srcset/tile@2x.png 2x">

    <div class="hero" style="
      background-image: url(/img/texture.png);
      color: #333"></div>
  </body>
</html>
