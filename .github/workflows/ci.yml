name: CI

on:
  push:
    branches: [main, v2]
  pull_request:

jobs:
  test:
    name: test (node ${{ matrix.node }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # Real end-to-end multipart requests through the middleware — not just a pack check.
      - name: Test
        run: npm test

  pack:
    name: verify published tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pack and list contents
        run: |
          npm pack --loglevel=warn
          tar -tzf upfly-*.tgz | sort

      # The tarball is an allowlist (package.json "files"). These guards catch the two
      # mistakes that actually shipped before: dead source and test files going public.
      - name: Guard against stray files in the tarball
        run: |
          contents="$(tar -tzf upfly-*.tgz)"
          for unwanted in "cloud_original" "test/" "tests/" ".vsix" ".tgz"; do
            if echo "$contents" | grep -q -- "$unwanted"; then
              echo "::error::Unexpected '$unwanted' in the published tarball"
              exit 1
            fi
          done
          echo "$contents" | grep -q "package/src/upfly.js" || { echo "::error::src/upfly.js missing"; exit 1; }
          echo "$contents" | grep -q "package/index.d.ts" || { echo "::error::index.d.ts missing"; exit 1; }
