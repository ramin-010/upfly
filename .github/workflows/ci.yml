name: CI

on:
  push:
    # `v3` is where the rewrite lives until it becomes `main` at launch, so CI has to
    # watch it or nothing runs on any commit in this phase.
    branches: [main, v3]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the previous generation's worst shipped
        # bug was platform-specific, so it is tested on every commit, not before release.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  coverage:
    name: coverage gate (core >= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Thresholds live in vitest.config.ts; this job fails if core drops below them.
      - run: pnpm coverage

  bench:
    # Rule 16: a performance claim is only ever a number `bench/` produced in CI.
    #
    # ⚠️ **This measures; it does not yet gate.** The budget it would gate against
    # was set on a bench tree whose source files averaged 179 bytes, against a
    # measured 4 704–6 666 in the three §5.1(c) repositories — so it is a budget for
    # reading 1.3 MB where a 10 000-file tree actually holds 46.7 MB. The tree is
    # recalibrated; the number has to be re-set, and it has to be re-set from here
    # rather than from a laptop running an editor and a browser.
    #
    # **To turn this into a gate:** read the headline from three green runs on each
    # cell, take the highest, add headroom, and set `UPFLY_BENCH_BUDGET_MS` per
    # platform below — then drop `--measure-only`. Both cells enforce, not just the
    # fast one: publishing the slower number is the point.
    name: bench (measure) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Graph budget across three invocations
        # Three separate processes, each a median of three runs after a discarded
        # warm-up. Sampling inside one process controls the filesystem cache and
        # nothing else — three consecutive invocations once reported medians 17%
        # apart while each was internally tight to 4–6%.
        run: pnpm --filter upfly-bench run bench -- --graph-only --invocations=3 --runs=3 --measure-only

  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify publishable output exists
        run: |
          test -f packages/core/dist/index.js || { echo "::error::core did not build"; exit 1; }
          test -f packages/core/dist/index.d.ts || { echo "::error::core types missing"; exit 1; }
          test -f packages/cli/dist/bin.js || { echo "::error::cli bin did not build"; exit 1; }
