name: CI

on:
  push:
    # `v3` is where the rewrite lives until it becomes `main` at launch, so CI has to
    # watch it or nothing runs on any commit in this phase.
    branches: [main, v3]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is a first-class target: the previous generation's worst shipped
        # bug was platform-specific, so it is tested on every commit, not before release.
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

  coverage-tree:
    # 🔴 R91. The answer key and the tree are ONE instrument, and nothing was checking
    # that they still agree — the coverage tree landed on 2026-09-13 and its own
    # self-check had never run in CI. A drifted key still reads green, which is exactly
    # what R75 says a key does, and the measuring harness refuses to produce a matrix
    # until this passes. So this is the gate in front of the gate.
    #
    # ⚠️ `prove` is the one that matters, and it runs SECOND on purpose. `check` says the
    # key and the tree agree; `prove` damages the tree eighteen ways and says the check
    # can still fail. A check nobody has seen fail is this project's dominant defect
    # class — four have shipped — and `check` passing tells you nothing about whether it
    # could ever have told you anything.
    #
    # ⚠️ Two cells rather than the six-way matrix: the key records BYTE offsets, which
    # are platform-independent only because `.gitattributes` pins `eol=lf`. Windows is
    # here to keep that promise honest — a CRLF checkout shifts every offset and this is
    # where it would show — and rule 5 makes Windows first-class regardless. The other
    # four cells would re-measure the same bytes.
    #
    # ⚠️ `coverage-tree:measure` is DELIBERATELY NOT HERE. It exits non-zero on 46
    # open questions about the engine and the key, so wiring it today would make CI red
    # on purpose. It goes in once those are ruled and either fixed or carrying a
    # `knownGap` — and it needs `pnpm build`, unlike these two, which import nothing.
    name: coverage tree self-check / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Key and tree agree
        run: pnpm coverage-tree:check

      - name: And the check can still fail
        run: pnpm coverage-tree:prove

  coverage:
    name: coverage gate (core >= 90%)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The matrix jobs get `dist` as a side effect of `pnpm typecheck`, which is
      # `tsc --build --force`. This job ran neither, so on a fresh checkout there was
      # no `packages/core/dist` and the one test that loads the built package could
      # not be collected. Building here is what makes that test meaningful rather
      # than merely absent.
      - run: pnpm build
      # Thresholds live in vitest.config.ts; this job fails if core drops below them.
      - run: pnpm coverage

  bench:
    # Rule 16: a performance claim is only ever a number `bench/` produced in CI.
    #
    # ✅ **This now GATES**, set on 2026-09-13 from three runs per platform that this
    # job had been printing under `--measure-only`:
    #
    #   ubuntu   3299, 4022, 4165 ms   max 4165   drift across runs 21.5%
    #   windows  4758, 5233, 5641 ms   max 5641   drift across runs 16.9%
    #
    # 🔴 **The ceiling is a REGRESSION line, not §3.4's 3 000 ms design target, and the
    # two must not be confused.** §5.1(g) failed against that target and it was
    # deliberately not moved; a green build here does not mean it is met. The bench
    # output prints both on every run so the distinction survives being read quickly.
    #
    # ⚠️ **The headroom is sized by the measured drift.** At the old 3 500/5 000 the same
    # commit reported OVER, within, OVER on ubuntu and within, OVER, OVER on windows —
    # the verdict flipped between runs of identical code. Max observed + ~30% clears it.
    # The cost is honest: this catches a regression above ~30% and cannot catch a 10%
    # one. For that, A/B back to back in one session with `bench/src/noise.ts`.
    name: bench (gate) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            budget: 5500
          - os: windows-latest
            budget: 7500
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Graph budget across three invocations
        # Three separate processes, each a median of three runs after a discarded
        # warm-up. Sampling inside one process controls the filesystem cache and
        # nothing else — three consecutive invocations once reported medians 17%
        # apart while each was internally tight to 4–6%.
        #
        # ⚠️ Three invocations is enough to catch a machine having a bad day and is NOT
        # enough to characterise the spread — the range of three draws understates it.
        # It is not what the ceiling is set from: that came from the run-to-run figures
        # above, which is the variation this job structurally cannot see.
        env:
          UPFLY_BENCH_BUDGET_MS: ${{ matrix.budget }}
        #
        # R134 step 1, as R142 re-ruled it: the run also prints a per-step breakdown —
        # discover / scan / resolve / graph, with read against parse inside scan. The gate
        # number above it is untouched and still sampled separately.
        #
        # It exists so queued changes can be attributed without a round-trip each: R132
        # lands in `resolve`, the markdown skip and the parse pool both land in `parse`.
        # Read it to say WHICH step moved; never quote it as a figure.
        #
        # 🔴 **R142: it is now SAMPLED — three passes in three processes, with a per-step
        # median, a per-step spread and `UNUSABLE` beside any step whose own samples
        # disagree.** One pass could not attribute anything: over a commit touching no
        # parse code, `parse` moved −2.5% on ubuntu and +12.5% on windows.
        #
        # ⚠️ **R143: three passes inside ONE run cannot see what R142 measured.** That
        # 15-point control was BETWEEN runs, and between-run drift is invisible from
        # inside a single run by construction (`invocations.ts`). The breakdown prints
        # that warning itself on every run.
        #
        # ✅ `--experiments` is what does survive drift: R141's variants, interleaved and
        # rotated inside this one job, so the A/B is immune to the drift between jobs.
        # It answers experiment 1 — stub the parse, measure `scan` — and it stays until
        # §5.1(g) closes, because experiments 2 and 3 use the same harness.
        run: pnpm --filter upfly-bench run bench -- --graph-only --invocations=3 --runs=3 --experiments

  build:
    name: build packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Verify publishable output exists
        run: |
          test -f packages/core/dist/index.js || { echo "::error::core did not build"; exit 1; }
          test -f packages/core/dist/index.d.ts || { echo "::error::core types missing"; exit 1; }
          test -f packages/cli/dist/bin.js || { echo "::error::cli bin did not build"; exit 1; }
