<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>The address on the next line</title>
  </head>
  <body>
    <h1>Our team</h1>

    <!--
      The address starts on the line below its opening quote, indented, so the value
      starts with a line break and spaces. A browser strips the whitespace around an
      address before loading it.
    -->
    <img alt="" src="
      /img/team.jpg">
  </body>
</html>
